[[faulty_sensors]]
site = "WallabyCreek"
variable = "Flu"
reason = "2007 over BARRA-R2's 100 m σTa⁴: median 1.19, 1.17 at night, when the canopy cools below the air and it should be under 1"

[[faulty_sensors]]
site = "WallabyCreek"
variable = "Fn"
reason = "the CNR4's net, from the faulty Fld and Flu"

[[faulty_sensors]]
site = "Whroo"
